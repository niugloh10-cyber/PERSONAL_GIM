<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="X-Frame-Options" content="SAMEORIGIN">
  <title>Sistema GIM v3.2 – Iniciar Sesión</title>
  <style>
    :root {
      --primary: #1a3c6e;
      --primary-light: #2655a0;
      --accent: #e8a020;
      --error: #c0392b;
      --success: #27ae60;
      --text: #2c3e50;
      --text-muted: #7f8c8d;
      --border: #dce3ed;
      --bg: #f0f4f8;
      --card: #ffffff;
      --shadow: 0 8px 32px rgba(26,60,110,0.12);
    }
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px}
    .escudo{display:flex;justify-content:center;margin-bottom:24px}
    .escudo svg{filter:drop-shadow(0 4px 8px rgba(26,60,110,.3))}
    .card{background:var(--card);border-radius:12px;box-shadow:var(--shadow);width:100%;max-width:420px;overflow:hidden;animation:slideUp .4s ease-out}
    @keyframes slideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
    .card-header{background:linear-gradient(135deg,var(--primary) 0%,var(--primary-light) 100%);padding:32px 28px 28px;text-align:center;color:#fff}
    .card-header h1{font-size:22px;font-weight:700;letter-spacing:.5px;margin-bottom:4px}
    .card-header p{font-size:12px;opacity:.85;line-height:1.4}
    .version-badge{display:inline-block;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);border-radius:20px;padding:2px 10px;font-size:11px;margin-top:8px}
    .card-body{padding:32px 28px}
    .alert{display:none;padding:12px 14px;border-radius:6px;font-size:13px;margin-bottom:20px;border-left:3px solid transparent;line-height:1.4}
    .alert.error{background:#fdf2f2;color:var(--error);border-color:var(--error);display:block;animation:fadeIn .2s}
    @keyframes fadeIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
    .form-group{margin-bottom:18px}
    .form-group label{display:block;font-size:13px;font-weight:600;color:var(--text);margin-bottom:6px}
    .form-group input{width:100%;padding:11px 14px;border:1px solid var(--border);border-radius:7px;font-size:14px;color:var(--text);background:#fff;transition:all .2s}
    .form-group input:focus{outline:none;border-color:var(--primary-light);box-shadow:0 0 0 3px rgba(38,85,160,.12)}
    .form-group input:disabled{background:#f5f7fa;cursor:not-allowed}
    .btn-login{width:100%;padding:12px;background:linear-gradient(135deg,var(--primary) 0%,var(--primary-light) 100%);color:#fff;border:none;border-radius:7px;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s;margin-top:8px;letter-spacing:.3px}
    .btn-login:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 20px rgba(26,60,110,.35)}
    .btn-login:active{transform:translateY(0)}
    .btn-login:disabled{opacity:.65;cursor:not-allowed}
    .spinner{display:inline-block;width:15px;height:15px;margin-right:8px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle}
    @keyframes spin{to{transform:rotate(360deg)}}
    .card-footer{background:#f8fafc;padding:16px 28px;text-align:center;border-top:1px solid var(--border);font-size:11px;color:var(--text-muted);line-height:1.6}
  </style>
</head>
<body>
  <div class="escudo">
    <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
      <rect width="64" height="64" rx="32" fill="#1a3c6e"/>
      <text x="32" y="40" text-anchor="middle" font-size="28" fill="#e8a020">⚙</text>
    </svg>
  </div>

  <div class="card">
    <div class="card-header">
      <h1>SISTEMA GIM</h1>
      <p>Generador de Memorándums y Declaraciones Juradas<br>Gerencia de Ingeniería Municipal</p>
      <div class="version-badge">v3.2.0</div>
    </div>

    <div class="card-body">
      <div class="alert" id="errorMsg"></div>

      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" placeholder="usuario@gim.local" autocomplete="email" autofocus required>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
      </div>

      <button class="btn-login" id="loginBtn" onclick="handleLogin()">
        Iniciar Sesión
      </button>
    </div>

    <div class="card-footer">
      Municipalidad Provincial de Puno &bull; Sistema Seguro v3.2
    </div>
  </div>

  <script>
    // Verificar sesión activa
    (function() {
      const t = localStorage.getItem('auth_token');
      if (t) window.location.href = '/dashboard.html';
    })();

    // Permitir Enter
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') handleLogin();
    });

    async function handleLogin() {
      const email    = (document.getElementById('email').value || '').trim();
      const password = document.getElementById('password').value || '';
      const btn      = document.getElementById('loginBtn');
      const errEl    = document.getElementById('errorMsg');

      errEl.className = 'alert';
      errEl.textContent = '';

      if (!email || !password) {
        mostrarError('Ingrese su correo y contraseña');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Verificando...';

      try {
        const resp = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, contrasena: password }),
        });

        const data = await resp.json();

        if (data.ok) {
          // Guardar sesión
          localStorage.setItem('auth_token', data.token);
          localStorage.setItem('usuario', JSON.stringify(data.usuario));
          btn.innerHTML = '✓ Accediendo...';
          window.location.href = '/dashboard.html';
        } else {
          mostrarError(data.error || 'Credenciales incorrectas');
        }
      } catch (e) {
        mostrarError('Error de conexión. Verifique que el servidor esté activo.');
      } finally {
        if (!window.location.href.includes('dashboard')) {
          btn.disabled = false;
          btn.textContent = 'Iniciar Sesión';
        }
      }
    }

    function mostrarError(msg) {
      const el = document.getElementById('errorMsg');
      el.textContent = msg;
      el.className = 'alert error';
    }
  </script>
</body>
</html>
